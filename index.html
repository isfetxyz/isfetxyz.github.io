<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISFET.XYZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Share Tech Mono', monospace;
            background: #000;
            color: #00cc00;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 4rem;
            text-shadow: 0 0 5px #00cc00, 0 0 15px #00cc00, 0 0 25px #00cc00;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            text-shadow: 0 0 3px #00cc00, 0 0 7px #00cc00;
        }

        a {
            color: #00cc00;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-shadow: 0 0 7px #00cc00, 0 0 15px #00cc00;
        }

        .footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #009900;
        }

        .glow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,255,0,0.2) 0%, rgba(0,0,0,1) 80%);
            z-index: -1;
        }

        .glitch {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .glitch-bar {
            position: absolute;
            height: 2px;
            background: rgba(0, 255, 0, 0.5);
            animation: glitch-animation 0.2s infinite;
        }

        @keyframes glitch-animation {
            0% {
                transform: translateX(0);
            }
            50% {
                transform: translateX(10px);
            }
            100% {
                transform: translateX(-10px);
            }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <h1>ISFET.XYZ</h1>
    <p>Created by <b>Anonymous</b> in November 2024</p>
    <p>Update coming soon.</p>
    <br><br>
    <a href="siteindex.html">Site Index</a>
    <div class="footer">
        <p>(C) 1$F3T group 2024 - current</p>
        <p>Contact: webhost@isfet.xyz</p>
    </div>
    <div class="glitch" id="glitch-container"></div>
    <script>
        function createGlitchBar() {
            const glitchContainer = document.getElementById('glitch-container');
            const bar = document.createElement('div');
            bar.classList.add('glitch-bar');
            bar.style.top = Math.random() * 100 + '%';
            bar.style.width = Math.random() * 50 + 10 + 'px';
            bar.style.left = Math.random() * 100 + '%';
            glitchContainer.appendChild(bar);

            setTimeout(() => {
                glitchContainer.removeChild(bar);
            }, 200);
        }

        setInterval(createGlitchBar, 100);
    </script>
</body>
</html>
